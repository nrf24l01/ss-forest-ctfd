<form method="POST" action="{{ script_root }}/admin/chal/new" enctype="multipart/form-data">
  <div class="form-group"><label>Название</label><input class="form-control" name="name" required></div>
  <div class="form-group"><label>Категория</label><input class="form-control" name="category" required></div>
  <div class="form-group"><label>Описание</label><textarea class="form-control" name="description" rows="8" required></textarea></div>
  <div class="form-group"><label>Шаблон инстанса</label><input class="form-control" name="source_dir" placeholder="flock-telemetry" required></div>
  <div class="form-group"><label>Внутренний порт</label><input class="form-control" type="number" name="redirect_port" required></div>
  <div class="form-group"><label>Attack Points</label><input class="form-control" type="number" min="0" step="0.0001" name="attack_points" required></div>
  <input type="hidden" name="type" value="territory_owl">
  <button class="btn btn-primary float-right create-challenge-submit" type="submit">Создать</button>
</form>
