services:
  ctfd:
    environment:
      WORKERS: "2"
      TERRITORY_DEVICE_SECRET: ${TERRITORY_DEVICE_SECRET}
      TERRITORY_DEFENSE_MULTIPLIER: ${TERRITORY_DEFENSE_MULTIPLIER:-1}
      TERRITORY_ATTACK_MULTIPLIER: ${TERRITORY_ATTACK_MULTIPLIER:-2}
  territory-worker:
    build: .
    restart: always
    entrypoint: ["python", "-m", "CTFd.plugins.territory_control.worker"]
    environment:
      DATABASE_URL: mysql+pymysql://ctfd:ctfd@db/ctfd
      REDIS_URL: redis://cache:6379
    volumes:
      - .:/opt/CTFd:ro
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
      default:
      internal:
